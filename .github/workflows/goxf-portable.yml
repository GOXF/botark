name: GOXF Portable

# GOXF fork only. Builds the Windows portable exe + unpacked-folder zip.
#   tag v<version>-goxf.<goxfBuild> (both from package.json)  → stable release (正式通道)
#   every push to branch goxf/portable                       → prerelease v<version>-goxf.dev.<sha7> (测试通道),
#                                                              only the newest 5 dev prereleases (and tags) are kept
#   manual dispatch                                          → run artifact only
# Assets per release (read by src/main/goxfUpdater.ts):
#   BotArk-Portable-<v>-win-x64.zip                full program folder (+ empty BotArk-Data)
#   manifest-BotArk-Portable-<v>-win-x64.json      every program file: path, sha256, size (BotArk-Data excluded)
#   patch-BotArk-Portable-<v>-win-x64.zip          the whole resources/ folder; applied file-by-file when the
#                                                  runtime (everything outside resources/) matches the manifest
#   *Portable*.exe                                 single-exe build
# Fast path (job fast, ~2 min): a push to goxf/portable that leaves the Electron runtime alone since the newest
# full release (no change to package.json dependencies/devDependencies/overrides, package-lock.json,
# electron-builder.config.cjs, build/) skips electron-builder: electron-vite build, app.asar rebuilt from the base
# release's patch (its node_modules kept), and only manifest + patch are published (no zip/exe). The manifest's
# runtime entries come from the base, so clients on that runtime take the delta. See scripts/goxf-fast.mts.
# Anything else, or a failed fast job, runs the full build (job portable).
on:
  push:
    tags: ['v*-goxf.*']
    branches: ['goxf/portable']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goxf-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    if: github.repository == 'GOXF/botark'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff against the base release's tag
      - name: CRLF checkout like the Windows full build, so out/ is byte-identical
        run: git config core.autocrlf true && git rm -rq --cached . && git reset -q --hard
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Fast (patch only) or full build
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" > "$RUNNER_TEMP/releases.json"
            node --no-warnings scripts/goxf-fast.mts plan "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"
          else
            echo "mode=full" | tee -a "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.mode == 'fast'
        run: npm ci --ignore-scripts # no Electron binary needed: electron-builder does not run
      - name: Stamp build identity, then typecheck + test + build in parallel
        if: steps.plan.outputs.mode == 'fast'
        run: |
          tag="v$(node -p "require('./package.json').version")-goxf.dev.${GITHUB_SHA::7}"
          echo "GOXF_TAG=$tag" >> "$GITHUB_ENV"
          npm pkg set "goxfTag=$tag" "goxfBuiltAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run typecheck & tc=$!
          npm test & t=$!
          npx electron-vite build & b=$!
          wait $tc && wait $t && wait $b
      - name: Patch + manifest on top of the base release
        if: steps.plan.outputs.mode == 'fast'
        run: |
          ver="${GOXF_TAG#v}"
          name="BotArk-Portable-$ver-win-x64"
          base="$RUNNER_TEMP/base"
          gh release download "${{ steps.plan.outputs.base }}" --repo "$GITHUB_REPOSITORY" -p 'manifest-*.json' -p 'patch-*.zip' -D "$base"
          unzip -q "$base"/patch-*.zip -d "$base/app"
          node --no-warnings scripts/goxf-fast.mts assemble "$base/app/resources" "$base"/manifest-*.json "$ver" "$RUNNER_TEMP/new"
          mkdir -p release
          mv "$RUNNER_TEMP/new/manifest.json" "release/manifest-$name.json"
          (cd "$RUNNER_TEMP/new" && zip -qrX "$GITHUB_WORKSPACE/release/patch-$name.zip" resources)
      - name: Publish dev prerelease (manifest + patch only)
        if: steps.plan.outputs.mode == 'fast'
        run: |
          gh release create "$GOXF_TAG" release/manifest-*.json release/patch-*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "BotArk Portable $GOXF_TAG (测试·增量)" \
            --notes "Fast dev build of $GITHUB_SHA: resources/ only, no full zip. Applies as a delta on the runtime of ${{ steps.plan.outputs.base }}."
      - name: Keep the newest 5 dev prereleases (and the newest full one)
        if: steps.plan.outputs.mode == 'fast'
        continue-on-error: true
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node --no-warnings scripts/goxf-fast.mts prune "$RUNNER_TEMP/releases.json" |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done

  portable:
    needs: fast
    # Full build unless the fast path published; also the fallback when the fast job failed.
    if: always() && github.repository == 'GOXF/botark' && (needs.fast.outputs.mode != 'fast' || needs.fast.result == 'failure')
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json version + goxfBuild
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(node -p "const p=require('./package.json'); p.version + '-goxf.' + p.goxfBuild")"
          if [ "$expected" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $expected"
            exit 1
          fi
      - name: Release tag for this build
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then t="$TAG"
          else t="v$(node -p "require('./package.json').version")-goxf.dev.${GITHUB_SHA::7}"; fi
          echo "GOXF_TAG=$t" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp build identity into package.json (the updater compares it with releases)
        shell: bash
        run: npm pkg set "goxfTag=$GOXF_TAG" "goxfBuiltAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - run: npm run build
      - name: Build portable exe + unpacked folder
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.config.cjs --win portable dir --x64 --publish never
      - name: Zip the unpacked folder (BotArk-Data inside marks it portable) + delta manifest and patch
        shell: pwsh
        run: |
          $ver = $env:GOXF_TAG.Substring(1)
          $name = "BotArk-Portable-$ver-win-x64"
          node scripts/goxf-manifest.mjs release/win-unpacked $ver "release/manifest-$name.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Patch = resources/ only (app.asar etc.); entries are "resources/…", matching manifest paths.
          Compress-Archive -Path release/win-unpacked/resources -DestinationPath "release/patch-$name.zip"
          $root = Join-Path $env:RUNNER_TEMP $name
          Copy-Item -Recurse release/win-unpacked $root
          New-Item -ItemType Directory -Path (Join-Path $root 'BotArk-Data') | Out-Null
          Set-Content -Encoding utf8 -Path (Join-Path $root 'BotArk-Data/README.txt') -Value 'BotArk portable data folder. Keep it next to BotArk.exe; copy the whole folder to move BotArk with your accounts.'
          Compress-Archive -Path $root -DestinationPath "release/$name.zip"
      - name: Publish fork release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*Portable*.exe release/*Portable*.zip release/manifest-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no portable build in release/"
            ls release || true
            exit 1
          fi
          if [ "${{ github.ref_type }}" != tag ]; then
            # A failed fast job may have left this tag's release behind; the full build replaces it.
            gh release delete "$GOXF_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            # Created with GITHUB_TOKEN, so this tag does not re-trigger the tag build.
            gh release create "$GOXF_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "BotArk Portable $GOXF_TAG (测试)" --notes "Dev build of $GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            node --no-warnings scripts/goxf-fast.mts prune "$RUNNER_TEMP/releases.json" |
              while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Not --latest: keeps the fork's "latest" free so nothing confuses it with upstream.
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "BotArk Portable $TAG" --generate-notes --latest=false
          fi
      - name: Keep the build as a run artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: botark-portable
          path: |
            release/*Portable*.exe
            release/*Portable*.zip
            release/manifest-*.json
