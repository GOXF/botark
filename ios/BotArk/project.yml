name: BotArk
options:
  bundleIdPrefix: com.qybaihe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.13.2"
    CURRENT_PROJECT_VERSION: "5"
    PRODUCT_NAME: "$(TARGET_NAME)"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  BotArk:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qybaihe.botark.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BotArk
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描 BotArk 电脑端配对二维码，在局域网或 Tailscale 下零服务器直接同步全部 AI 助手。"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "BotArk 需要访问本地网络以直连同一局域网或 Tailscale 中的电脑端 BotArk，无需任何云端服务器。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: BotArk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "扫描 BotArk 电脑端配对二维码，在局域网或 Tailscale 下零服务器直接同步全部 AI 助手。"
        NSLocalNetworkUsageDescription: "BotArk 需要访问本地网络以直连同一局域网或 Tailscale 中的电脑端 BotArk，无需任何云端服务器。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.qybaihe.botark.pair
            CFBundleURLSchemes:
              - botark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - JetBrainsMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  BotArkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BotArkTests
    dependencies:
      - target: BotArk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qybaihe.botark.ios.tests
        GENERATE_INFOPLIST_FILE: YES
